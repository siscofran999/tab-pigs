name: Build Release AAB

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    name: Build Prod AAB
    runs-on: ubuntu-latest

    steps:
      # 1. Mengambil kode dari repository
      - name: Checkout Code
        uses: actions/checkout@v4

      # 2. Menyiapkan Java (Gunakan Java 17 yang menjadi standar Compose modern)
      - name: Setup Java JDK
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '21'
          cache: 'gradle' # Fitur ini bikin build selanjutnya jauh lebih cepat!

      # 3. Memberikan izin eksekusi pada Gradle
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # 4. Rakit ulang teks Base64 kembali menjadi file keystore.jks
      - name: Decode Keystore
        env:
          ENCODED_KEYSTORE: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          echo $ENCODED_KEYSTORE | base64 --decode > keystore.jks

      # 5. Lakukan build AAB dengan menyuntikkan variabel environment
      - name: Build Release AAB
        env:
          # Pastikan penamaan variabel sama persis dengan yang ada di build.gradle.kts
          RELEASE_STORE_FILE: ${{ github.workspace }}/keystore.jks
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: ./gradlew bundleRelease

      # 6. Mengunggah hasil APK agar bisa kamu download
      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: TabPigs-Release-AAB
          path: app/build/outputs/bundle/release/app-release.aab